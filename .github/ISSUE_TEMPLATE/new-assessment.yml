name: Method assessment
description: Submit a new method assessment
title: "[Assessment request]: "
labels: ["method", "assessment"]
assignees:
  - estopinj
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this method assessment!
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false
  - type: input
    id: author
    attributes:
      label: Page’s Author & Date
      placeholder: ex. Jean Dupont
    validations:
      required: true

  - type: dropdown
    id: documented_method
    attributes:
      label: Is the method already documented in NaviDAM?
      description: Look if the method is already documented in NaviDAM. If it is, please provide the exact same name below.
    options:
      - Yes
      - No
    validations:
      required: true
  - type: dropdown
    id: assessed_method
    attributes:
      label: Is the method already assessed in NaviDAM?
      description: Look if the method is already assessed in NaviDAM. If it is, please provide the exact same name below.
    options:
      - Yes
      - No
    validations:
      required: true
  - type: input
    id: method_name
    attributes:
      label: METHOD NAME
      description: Name of method to be assessed.
      placeholder: ex. Synthetic Control Method
    validations:
      required: true


  - type: markdown
    attributes:
      value: |
        ## Assessment logic
        - **Please tick ALL the options that apply.**
        - Situating the method against the unified criteria of NaviDAM will next enable users to filter down the approaches suited to their needs.
        - One entry can actually correspond to a family of methods (e.g. DiD).
          - In this case, the assessment should be based on the **most common** or **original** variant of the method, and add the options matching major & widespread variants.
        - Rationale and comments can be added at the end of the form to justify the assessment or provide any additional information.

        *See the [criteria description](https://estopinj.github.io/dam/criteria) for more details on the criteria and how to assess them*


  - type: markdown
    attributes:
      value: |
        ## Method group

  - type: checkboxes
    id: category
    attributes:
      label: Category
      description: "Multiple: Tick all that apply & at least one (only for method page organization)"
      options:
        - label: "Counterfactual & future simulations"
        - label: "Experiments"
        - label: "Ecology-guided Modelling"
        - label: "Adjusted methods (Backdoor C.)"
        - label: "Quasi-experiments"
        - label: "Causal ML"
        - label: "Causal discovery"
        - label: "Alternative paradigms"
        - label: "Versatile tools"
        - label: "Independent detection"
    validations:
      required: true

  - type: dropdown
    id: sub_category
    attributes:
      label: Sub-category
      description: "Multiple, can be left unspecified (only for method page organization)"
      multiple: true
      options:
        - "Process-based methods"
        - "Linear regressions & extensions"
        - "Predictive models +  interpretability metrics"
        - "Alternative effect identification methods"
        - "Meta-learners"
        - "Constraint-based methods"
        - "Score-based methods"
        - "Continuous optimization"
        - "Asymmetry-based"
        - "Prediction-based approaches"
        - "Intermediate confounding"
        - "Visualisation helpers"
        - "Robustness & significance tests"
        - "Causal interpretability"
        - "Uncertainty tools"
        - "Trend detection"
        - "RS breakpoint detection"
        - "Frequently monitored indices"
        - "Preliminary data correction"

  - type: markdown
    attributes:
      value: |
        ## Objective

  - type: checkboxes
    id: objective
    attributes:
      label: Objective
      description: Tick all the objectives that the method can address (at least one)
      options:
        - label: Effect estimation
        - label: Causal relationship(s)
        - label: Predictive task + interpretability
        - label: Detection
        - label: Significance and robustness tests
        - label: Scenario projection
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Outcome
  
  - type: checkboxes
    id: estimand
    attributes:
      label: Estimand
      description: "Multiple: Tick all that apply & at least one"
      options:
        - label: ATT
        - label: ATE
        - label: LATE
        - label: CATE
        - label: Mediation effects
        - label: Oriented link
        - label: Risk ratios
        - label: Maps & generalisations
        - label: Abrupt change
        - label: Trend
        - label: Others
        - label: Inapplicable
    validations:
      required: true 
  
  - type: markdown
    attributes:
      value: |
        ## Data compatibility
  
  - type: checkboxes
    id: data_type
    attributes:
      label: Type
      description: "Multiple: Tick all that apply & at least one"
      options:
        - label: Spatial only (cross-sectional)
        - label: Time-series (one sample)
        - label: Panel data (many samples)
        - label: Inapplicable
    validations:
      required: true

  - type: dropdown # Ordinal criteria
    id: minimal_ts_length
    attributes:
      label: Minimal TS length
      description: Ordinal from most to least permissive, pick highest option that applies.
      options:
        - ≥ 100
        - ≥ 10
        - Handles ≤ 10
        - Inapplicable
    validations:
      required: true
  
  - type: dropdown # Ordinal criteria
    id: handles_few_samples
    attributes:
      label: Handles few samples
      description: Ordinal from most to least permissive, pick highest option that applies.
      options:
        - label: "No"
        - label: 10 to 100
        - label: Yes ≤ 10
        - label: Yes CT design
        - label: Inapplicable
    validations:
      required: true
  
  - type: dropdown # Ordinal criteria
    id: handles_huge_datasets
    attributes:
      label: Handles huge datasets (n)
      description: Ordinal from most to least permissive, pick highest option that applies.
      options:
        - label: "No"
        - label: Most dont
        - label: Most do
        - label: "Yes"
        - label: Inapplicable
    validations:
      required: true
  
  - type: dropdown # Ordinal criteria
    id: handles_missing_data
    attributes:
      label: Handles missing data
      description: Ordinal from most to least permissive, pick highest option that applies.
      options:
        - label: "No: requires prelim. correction"
        - label: Partially
        - label: "Yes"
        - label: Inapplicable
    validations:
      required: true
  
  - type: dropdown # Ordinal criteria
    id: rs_data_proven
    attributes:
      label: RS-data proven
      description: Ordinal from most to least permissive, pick highest option that applies.
      options:
        - label: "No"
        - label: Few applications
        - label: "Yes"
        - label: Inapplicable
    validations:
      required: true
  
  - type: markdown
    attributes:
      value: | 
        ## Model properties
  
  - type: checkboxes
    id: requires_explicit_processes
    attributes:
      label: Requires explicit processes
      description: "Multiple: Tick all that apply & at least one"
      options:
        - label: "Yes"
        - label: Optional
        - label: Agnostic
        - label: Inapplicable
    validations:
      required: true
  
  - type: checkboxes
    id: exposure_type
    attributes:
      label: Exposure type
      description: "Multiple: Tick all that apply & at least one"
      options:
        - label: Binary
        - label: Categorical
        - label: Continuous / Time-varying
        - label: Compositional
        - label: Multivariate
        - label: Others
        - label: All
        - label: Inapplicable
    validations:
      required: true
  
  - type: checkboxes
    id: number_of_variables
    attributes:
      label: Number of variables
      description: "Multiple: Tick all that apply & at least one"
      options:
        - label: Univariate
        - label: Bivariate
        - label: Multivariate
        - label: High-dimensional (p≫n)
        - label: Inapplicable
    validations:
      required: true
  
  - type: dropdown # Ordinal criteria
    id: propagates_uncertainty
    attributes:
      label: Propagates uncertainty
      description: Ordinal from most to least permissive, pick highest option that applies.
      options:
        - label: Needs model-agnostic propagation
        - label: Model-specific tools
        - label: Inherent capacity
        - label: Inapplicable
    validations:
      required: true
  
  - type: dropdown # Ordinal criteria
    id: handles_lag_effects
    attributes:
      label: Handles lag effects
      description: Ordinal from most to least permissive, pick highest option that applies.
      options:
        - label: "No"
        - label: Possible
        - label: "Yes"
        - label: Inapplicable
    validations:
      required: true

  - type: checkboxes
    id: parametric_nature
    attributes:
      label: Parametric nature
      description: "Multiple: Tick all that apply & at least one"
      options:
        - label: Parametric
        - label: Semi-parametric
        - label: Non-parametric
        - label: Rule-based
        - label: Inapplicable
    validations:
      required: true

  - type: markdown
    attributes:
      value: | 
        ## Implementation
  
  - type: checkboxes
    id: language
    attributes:
      label: Language
      description: "Multiple: Tick all that apply & at least one"
      options:
        - label: R
        - label: Python
        - label: GIS
        - label: Others
        - label: No package
        - label: Inapplicable
    validations:
      required: true

  - type: checkboxes
    id: usage
    attributes:
      label: Usage
      description: "Multiple: Tick all that apply & at least one"
      options:
        - label: User-friendly
        - label: Technical but well documented
        - label: Sparse documentation
        - label: Domain-specific skills
        - label: Varying
        - label: Inapplicable
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Assumptions
  
  - type: checkboxes
    id: functional_form
    attributes:
      label: Functional form
      description: "Multiple: Tick all that apply & at least one"
      options:
        - label: Linear
        - label: Quadratic
        - label: Non-linear
        - label: Additivity
        - label: Assumption-free
        - label: Rule-based
        - label: Log-linear
        - label: Inapplicable
    validations:
      required: true

  - type: dropdown # Ordinal criteria
    id: no_unobserved_confounders
    attributes:
      label: No unobserved confounders
      description: Ordinal from most to least permissive, pick highest option that applies.
      options:
        - label: Required
        - label: Recommended
        - label: Relaxes assumption
        - label: Inapplicable
    validations:
      required: true

  - type: dropdown # Ordinal criteria
    id: no_interference
    attributes:
      label: No interference
      description: "Multiple: Tick all that apply & at least one"
      options:
        - label: Required
        - label: Recommended
        - label: Relaxes assumption
        - label: Inapplicable
    validations:
      required: true

  - type: dropdown # Ordinal criteria
    id: well_defined_treatments
    attributes:
      label: Well-defined treatments
      description: "Multiple: Tick all that apply & at least one"
      options:
        - label: Required
        - label: Recommended
        - label: Relaxes assumption
        - label: Inapplicable
    validations:
      required: true
  
  - type: dropdown # Ordinal criteria
    id: common_support_positivity
    attributes:
      label: Common support (positivity)
      description: Ordinal from most to least permissive, pick highest option that applies.
      options:
        - label: Required
        - label: Recommended
        - label: Relaxes assumption
        - label: Inapplicable
    validations:
      required: true
  
  - type: dropdown # Ordinal criteria
    id: causal_markov_condition
    attributes:
      label: Causal Markov Condition
      description: Ordinal from most to least permissive, pick highest option that applies.
      options:
        - label: Required
        - label: Recommended
        - label: Relaxes assumption
        - label: Inapplicable
    validations:
      required: true
  
  - type: dropdown # Ordinal criteria
    id: faithfulness
    attributes:
      label: Faithfulness
      description: Ordinal from most to least permissive, pick highest option that applies.
      options:
        - label: Required
        - label: Recommended
        - label: Relaxes assumption
        - label: Inapplicable
    validations:
      required: true
  
  - type: dropdown # Ordinal criteria
    id: iid
    attributes:
      label: IID
      description: Ordinal from most to least permissive, pick highest option that applies.
      options:
        - label: Required
        - label: Recommended
        - label: Relaxes assumption
        - label: Inapplicable
    validations:
      required: true

  - type: checkboxes
    id: model_specific_assumptions
    attributes:
      label: Model-specific assumptions
      description: "Multiple: Tick all that apply & at least one"
      options:
        - label: Parallel trends
        - label: Stationarity
        - label: Dispersal / reproduction / mortality
        - label: Instrument validity
        - label: Normality of random effects
        - label: No M-O confounding
        - label: Good covariate balance
        - label: Effect entirely mediated
        - label: Cutoff + PO continuity
        - label: B/A treatment obs.
        - label: Good pretreatment fit
        - label: Time-varying or site-varying C.
        - label: Dynamic system

  - type: dropdown # Ordinal criteria
    id: confidence
    attributes:
      label: Confidence in assessment
      description: How confident are you in your method assessment?
      options:
        - label: 1
        - label: 2
        - label: 3
        - label: 4
        - label: 5
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Rationale and additional comments
      placeholder: Any rationale you would like to share about the method assessment, how/why some options were chosen, or any other comment you would like to share.
    validations:
      required: false


  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/estopinj/dam/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
